name: Build and Package PII Scanner

on:
  push:
    branches:
      - main
      - feature/html-reports-and-installer-fix
  pull_request:
    branches:
      - main
      - feature/html-reports-and-installer-fix

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set environment variables
        run: |
          echo "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV
          echo "PYTHONUTF8=1" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "protobuf<=3.20.0" --force-reinstall

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --uac-admin --add-data ".env.example;." --add-data "pii_scanner.xml;." --hidden-import=openpyxl pii_scanner.py

      - name: Verify build output
        run: |
          if (Test-Path "dist\pii_scanner.exe") {
            Write-Host "SUCCESS: pii_scanner.exe created successfully"
            $fileSize = (Get-Item "dist\pii_scanner.exe").Length
            Write-Host "INFO: Executable size: $([math]::Round($fileSize / 1MB, 1)) MB"
          } else {
            Write-Host "ERROR: pii_scanner.exe not found"
            exit 1
          }

      - name: Install NSIS
        run: |
          choco install nsis -y

      - name: Create NSIS installer
        run: |
          makensis pii_scanner_installer.nsi

      - name: Verify installer
        run: |
          if (Test-Path "PII_Scanner_Installer.exe") {
            Write-Host "SUCCESS: Installer created successfully"
            $installerSize = (Get-Item "PII_Scanner_Installer.exe").Length
            Write-Host "INFO: Installer size: $([math]::Round($installerSize / 1MB, 1)) MB"
          } else {
            Write-Host "ERROR: Installer not found"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PII_Scanner_Installer
          path: PII_Scanner_Installer.exe

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PII_Scanner_Executable
          path: dist/pii_scanner.exe
